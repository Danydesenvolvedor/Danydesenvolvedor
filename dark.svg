<svg width="1200" height="420"
viewBox="0 0 1200 420"
fill="none"
xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop stop-color="#050816"/>
<stop offset="0.5" stop-color="#111827"/>
<stop offset="1" stop-color="#020617"/>
</linearGradient>


<linearGradient id="title">
<stop stop-color="#00D9FF">
<animate attributeName="stop-color"
values="#00D9FF;#7B2FFF;#00D9FF"
dur="6s"
repeatCount="indefinite"/>
</stop>

</linearGradient>


<filter id="blur">
<feGaussianBlur stdDeviation="40"/>
</filter>


<radialGradient id="glow">

<stop stop-color="#00D9FF"
stop-opacity="0.7"/>

<stop offset="1"
stop-color="#00D9FF"
stop-opacity="0"/>

</radialGradient>


</defs>


<!-- Background -->

<rect width="1200"
height="420"
rx="30"
fill="url(#bg)"/>


<!-- Animated glow -->

<circle cx="180"
cy="220"
r="180"
fill="url(#glow)"
filter="url(#blur)">

<animate attributeName="cx"
values="180;300;180"
dur="8s"
repeatCount="indefinite"/>

</circle>


<circle cx="950"
cy="80"
r="160"
fill="#7B2FFF"
opacity="0.25"
filter="url(#blur)">

<animate attributeName="cy"
values="80;250;80"
dur="10s"
repeatCount="indefinite"/>

</circle>


<!-- Particles -->

<g fill="#00D9FF">

<circle cx="100" cy="80" r="3">
<animate attributeName="cy"
values="80;300;80"
dur="7s"
repeatCount="indefinite"/>
</circle>


<circle cx="900" cy="350" r="4">
<animate attributeName="cy"
values="350;120;350"
dur="9s"
repeatCount="indefinite"/>
</circle>


<circle cx="700" cy="70" r="2">
<animate attributeName="cy"
values="70;260;70"
dur="6s"
repeatCount="indefinite"/>
</circle>

</g>



<!-- Avatar container -->

<circle cx="1030"
cy="210"
r="120"
fill="#111827"
stroke="#00D9FF"
stroke-width="5"/>


<!-- Photo -->

<image
href="assets/avatar/dany.png"
x="930"
y="110"
width="200"
height="200"
preserveAspectRatio="xMidYMid slice"/>



<!-- Text -->


<text
x="70"
y="130"
fill="white"
font-size="42"
font-family="Arial"
font-weight="700">

Danilson Ramos

</text>



<text
x="70"
y="190"
fill="url(#title)"
font-size="30"
font-family="Arial">

Software Engineer

</text>



<text
x="70"
y="245"
fill="#CBD5E1"
font-size="20"
font-family="Arial">

AI • Cybersecurity • Full Stack Development

</text>



<!-- Typing cursor -->

<rect
x="70"
y="285"
width="15"
height="35"
fill="#00D9FF">

<animate attributeName="opacity"
values="1;0;1"
dur="1s"
repeatCount="indefinite"/>

</rect>



<text
x="100"
y="312"
fill="#94A3B8"
font-size="18"
font-family="monospace">

Building scalable digital solutions...

</text>



</svg>
