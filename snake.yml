# Save this file as .github/workflows/snake.yml in your danydesenvolvedor/danydesenvolvedor repo.
# It generates the contribution snake referenced in the README (output branch: snake.svg + snake-dark.svg)
# and needs no extra setup — it uses the repo's own built-in GITHUB_TOKEN.

name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"   # once a day
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: danydesenvolvedor
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
